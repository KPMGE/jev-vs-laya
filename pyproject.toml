[project]
name = "triage"
version = "0.1.0"
description = "Support-message triage classifier: Laya (base, fine-tuned) vs Jev"
authors = [
    { name = "Kevin Carvalho de Jesus", email = "jesuskevin254@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "laya[serve]==0.4.17",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"
